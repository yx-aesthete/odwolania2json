# docker compose run --rm odwolania2json      -> przetwarza ./input do ./output
# docker compose up web                       -> prototyp WWW: http://localhost:8000 (inny port: WEB_PORT=8080)
# Model językowy (opcjonalny) tylko po API: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL w pliku .env
x-wspolne: &wspolne
  build: .
  image: odwolania2json:latest
  env_file:
    - path: .env
      required: false
  environment:
    MODEL_TRYB: ${MODEL_TRYB:-}
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}   # tryb lokalny: serwer modelu na hoście, nie w Dockerze
  volumes:
    - ./input:/app/input
    - ./output:/app/output
    - ./audit:/app/audit
    - ./config:/app/config:ro

services:
  odwolania2json:
    <<: *wspolne
  web:
    <<: *wspolne
    entrypoint: ["python", "-m", "odwolania2json.web", "--host", "0.0.0.0", "--port", "8000"]
    command: []
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    profiles: ["web"]
